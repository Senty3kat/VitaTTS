name: Build VPK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      VITASDK: /home/runner/vitasdk
    steps:
      - uses: actions/checkout@v4

      # ---------- VitaSDK (кеш) ----------
      - name: Restore VitaSDK cache
        id: cvita
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/vitasdk
          key: vitasdk-2026.08-libvita2d-v1

      - name: VitaSDK + vita2d
        id: vinst
        if: steps.cvita.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/vitasdk/vdpm
          cd vdpm
          ./bootstrap-vitasdk.sh
          export PATH=$VITASDK/bin:$PATH
          vdpm pacman -- -S --noconfirm libvita2d || (yes | vdpm install libvita2d || true)
          test -f $VITASDK/arm-vita-eabi/lib/libvita2d.a
          echo "ok=1" >> $GITHUB_OUTPUT

      - name: Save VitaSDK cache
        if: steps.vinst.outputs.ok == '1'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/vitasdk
          key: vitasdk-2026.08-libvita2d-v1

      # ---------- eSpeak-NG (кеш исходников и данных) ----------
      - name: Restore eSpeak cache
        id: cesp
        uses: actions/cache/restore@v4
        with:
          path: |
            espeak-ng
            payload/espeak-ng-data
          key: espeak-1.51.1-v1

      - name: eSpeak-NG (исходники + данные языков)
        id: einst
        if: steps.cesp.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config make
          mkdir -p payload
          rm -rf espeak-ng
          git clone --depth 1 --branch 1.51.1 https://github.com/espeak-ng/espeak-ng
          cd espeak-ng
          ./autogen.sh
          ./configure --prefix=/usr --without-async --without-mbrola --without-sonic --without-pcaudiolib --without-speechplayer
          make -j4
          make install DESTDIR=$GITHUB_WORKSPACE/inst
          cd ..
          D=$(find inst -type d -name espeak-ng-data | head -1)
          rm -rf payload/espeak-ng-data
          cp -r "$D" payload/espeak-ng-data
          find payload/espeak-ng-data -maxdepth 1 -name '*_dict' ! -name ru_dict ! -name en_dict ! -name ja_dict -delete
          rm -rf payload/espeak-ng-data/mbrola_ph
          find payload -name '* *' -print -delete
          test -f payload/espeak-ng-data/phontab
          echo "ok=1" >> $GITHUB_OUTPUT

      - name: Save eSpeak cache
        if: steps.einst.outputs.ok == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            espeak-ng
            payload/espeak-ng-data
          key: espeak-1.51.1-v1

      # ---------- Pico ----------
      - name: Pico / SVOX (исходники + голоса)
        continue-on-error: true
        run: |
          mkdir -p payload
          git clone --depth 1 https://github.com/naggety/picotts
          for f in en-US_ta.bin en-US_lh0_sg.bin en-GB_ta.bin en-GB_kh0_sg.bin; do
            cp "$(find picotts -name $f | head -1)" payload/
          done

      # ---------- SAM ----------
      - name: SAM (исходники)
        continue-on-error: true
        run: git clone --depth 1 https://github.com/s-macke/SAM

      - name: Иконка
        run: |
          python3 - <<'EOF'
          import zlib, struct, math
          W = 128
          pix = [[0] * W for _ in range(W)]
          for x in range(W):
              y = int(64 + 32 * math.sin(x / 128 * 2 * math.pi * 3) * (1 - abs(x - 64) / 80))
              for d in range(-2, 3):
                  if 0 <= y + d < W:
                      pix[y + d][x] = 1
          raw = b''.join(b'\x00' + bytes(r) for r in pix)
          def ch(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = (b'\x89PNG\r\n\x1a\n'
                 + ch(b'IHDR', struct.pack('>IIBBBBB', W, W, 8, 3, 0, 0, 0))
                 + ch(b'PLTE', bytes([24, 24, 40, 0, 230, 170]))
                 + ch(b'IDAT', zlib.compress(raw))
                 + ch(b'IEND', b''))
          open('icon0.png', 'wb').write(png)
          EOF

      - name: Сборка VPK (с запасными вариантами)
        run: |
          export PATH=$VITASDK/bin:$PATH
          [ -f payload/en-US_ta.bin ] && P=1 || P=0
          [ -f payload/espeak-ng-data/phontab ] && E=1 || E=0
          [ -f SAM/src/sam.c ] && S=1 || S=0
          echo "pico data: $P, espeak data: $E, sam: $S"
          PL=$(dirname "$(find picotts -name picoapi.h 2>/dev/null | head -1)")
          PL=$(realpath "$PL" 2>/dev/null || echo "$PL")
          OK=0; N=0
          for c in "1 1 0 1" "1 1 0 0" "1 1 1 0" "1 0 0 0" "0 1 0 0"; do
            set -- $c
            [ "$1" = 1 ] && [ $P = 0 ] && continue
            [ "$2" = 1 ] && [ $E = 0 ] && continue
            [ "$4" = 1 ] && [ $S = 0 ] && continue
            N=$((N+1))
            echo "=== Пробую: pico=$1 espeak=$2 mbrowrap=$3 sam=$4 ==="
            rm -rf build; mkdir build; cd build
            if { cmake .. -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake \
                 -DCMAKE_BUILD_TYPE=Release \
                 -DWITH_PICO=$([ $1 = 1 ] && echo ON || echo OFF) \
                 -DWITH_ESPEAK=$([ $2 = 1 ] && echo ON || echo OFF) \
                 -DWITH_MBROWRAP=$([ $3 = 1 ] && echo ON || echo OFF) \
                 -DWITH_SAM=$([ $4 = 1 ] && echo ON || echo OFF) \
                 -DSAM_DIR=$GITHUB_WORKSPACE/SAM \
                 -DPICO_LIB="$PL" \
                 -DESPEAK_DIR=$GITHUB_WORKSPACE/espeak-ng \
                 -DPAYLOAD=$GITHUB_WORKSPACE/payload \
                 -DICON=$GITHUB_WORKSPACE/icon0.png \
               && make -j4 ; } > $GITHUB_WORKSPACE/log_$N.txt 2>&1 ; then
              cd ..; OK=1; echo "Собрано: pico=$1 espeak=$2 sam=$4" ; break
            fi
            cd ..
            echo "$c" > $GITHUB_WORKSPACE/log_$N.name
          done
          if [ $OK = 0 ]; then
            for f in log_*.txt; do
              echo "########## $f (вариант: $(cat ${f%.txt}.name))"
              grep -iE "error|undefined|fatal|ld returned|unresolved" $f | head -15
              echo "--- конец лога:"; tail -n 12 $f
            done
            exit 1
          fi
          ls -la build/*.vpk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: log_*.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: VitaTTS-vpk
          path: build/VitaTTS.vpk
